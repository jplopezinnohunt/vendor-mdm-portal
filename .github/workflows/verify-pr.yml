name: Verify Pull Request

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore dependencies
        run: dotnet restore VendorMdm.sln
        working-directory: backend
        
      - name: Build
        run: dotnet build VendorMdm.sln --configuration Release
        working-directory: backend
        
      - name: Test
        run: dotnet test VendorMdm.Api.Tests/VendorMdm.Api.Tests.csproj --configuration Release --verbosity normal
        working-directory: backend

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
          
      - name: Generate Version
        run: npm run generate:version
        working-directory: frontend
          
      - name: Lint
        run: npm run lint
        working-directory: frontend
          
      - name: Build
        run: npm run build
        working-directory: frontend
