name: Verify Pull Request

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore VendorMdm.sln
        working-directory: backend

      - name: Build
        run: dotnet build VendorMdm.sln --configuration Release
        working-directory: backend

      - name: Test
        run: dotnet test VendorMdm.Api.Tests/VendorMdm.Api.Tests.csproj --configuration Release --verbosity normal
        working-directory: backend

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate Version
        run: npm run generate:version
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npm run test:run
        working-directory: frontend
        env:
          NODE_OPTIONS: --max_old_space_size=4096

  migration-validation:
    name: Migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check migration file sizes
        run: |
          echo "Checking for oversized migrations (>50KB)..."
          # Pre-existing large migration: provider-switch re-scaffold (SQLite <-> SQL Server)
          # Cannot be split retroactively without breaking the migration chain
          KNOWN_LARGE="20260128183157_AddEventIdToInvitation.cs"
          LARGE_FILES=$(find backend/VendorMdm.Api/Migrations -name "*.cs" \
            ! -name "*Designer.cs" \
            ! -name "*Snapshot.cs" \
            ! -name "$KNOWN_LARGE" \
            -size +50k 2>/dev/null || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "❌ Found migrations larger than 50KB:"
            echo "$LARGE_FILES"
            echo "Split large migrations per Section 8.2 of moderngoldenrules.md"
            exit 1
          fi
          echo "✅ All migrations are under 50KB"

      - name: Check for conflict markers
        run: |
          echo "Checking for git conflict markers..."
          if grep -rn "<<<<<<\|>>>>>>\|======" --include="*.cs" --include="*.ts" --include="*.tsx" . 2>/dev/null; then
            echo "❌ Found git conflict markers in source files"
            exit 1
          fi
          echo "✅ No conflict markers found"
