name: Deploy Backend API to Azure

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/VendorMdm.Api/**'
      - 'backend/VendorMdm.Shared/**'
      - 'backend/VendorMdm.Core.Framework/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore backend/VendorMdm.sln

    - name: Build
      run: dotnet build backend/VendorMdm.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test backend/VendorMdm.Api.Tests/VendorMdm.Api.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish
      run: dotnet publish backend/VendorMdm.Api/VendorMdm.Api.csproj --configuration Release --no-build --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-api
        path: ./publish
        retention-days: 1

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development')
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://app-vendor-mdm-api-dev.azurewebsites.net

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-api
        path: ./publish

    - name: Deploy to Azure App Service (Dev)
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_APP_SERVICE_NAME || 'app-vendor-mdm-api-dev' }}
        publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE_DEV }}
        package: ./publish

    - name: Health check
      run: |
        echo "Waiting for deployment to stabilize..."
        sleep 30
        curl -f https://app-vendor-mdm-api-dev.azurewebsites.net/api/health || echo "Health check pending..."

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app-vendor-mdm-api-prod.azurewebsites.net

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-api
        path: ./publish

    - name: Deploy to Azure App Service (Prod)
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_APP_SERVICE_NAME || 'app-vendor-mdm-api-prod' }}
        publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE_PROD }}
        package: ./publish

    - name: Health check
      run: |
        echo "Waiting for deployment to stabilize..."
        sleep 30
        curl -f https://app-vendor-mdm-api-prod.azurewebsites.net/api/health || echo "Health check pending..."
