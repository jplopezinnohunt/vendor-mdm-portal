name: Deploy Backend API to Azure

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/VendorMdm.Api/**'
      - 'backend/VendorMdm.Shared/**'
      - 'backend/VendorMdm.Core.Framework/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore backend/VendorMdm.sln

    - name: Build
      run: dotnet build backend/VendorMdm.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test backend/VendorMdm.Api.Tests/VendorMdm.Api.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish
      run: dotnet publish backend/VendorMdm.Api/VendorMdm.Api.csproj --configuration Release --no-build --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-api
        path: ./publish
        retention-days: 1

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development')
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://app-vendor-mdm-api-dev.azurewebsites.net

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-api
        path: ./publish

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Ensure App Service is running (Dev)
      continue-on-error: true
      run: |
        APP_NAME="${{ vars.AZURE_APP_SERVICE_NAME_DEV || 'app-vendor-mdm-api-dev' }}"
        echo "Discovering resource group for $APP_NAME..."
        RG=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup" -o tsv 2>/dev/null | head -1)
        if [ -z "$RG" ]; then
          echo "WARNING: Could not find resource group for $APP_NAME - skipping state check"
          exit 0
        fi
        echo "Found resource group: $RG"
        STATE=$(az webapp show --name "$APP_NAME" --resource-group "$RG" --query "state" -o tsv 2>/dev/null || echo "Unknown")
        echo "App Service state: $STATE"
        if [ "$STATE" != "Running" ]; then
          echo "Starting App Service..."
          az webapp start --name "$APP_NAME" --resource-group "$RG"
          echo "Waiting for App Service to start..."
          sleep 15
        fi

    - name: Configure App Settings (Dev)
      uses: azure/appservice-settings@v1
      with:
        app-name: ${{ vars.AZURE_APP_SERVICE_NAME_DEV || 'app-vendor-mdm-api-dev' }}
        app-settings-json: |
          [
            { "name": "ASPNETCORE_ENVIRONMENT", "value": "Development" },
            { "name": "App__BaseUrl", "value": "https://thankful-field-0258f8110.3.azurestaticapps.net" }
          ]

    - name: Deploy to Azure App Service (Dev)
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_APP_SERVICE_NAME_DEV || 'app-vendor-mdm-api-dev' }}
        package: ./publish

    - name: Health check
      run: |
        APP_URL="https://${{ vars.AZURE_APP_SERVICE_NAME_DEV || 'app-vendor-mdm-api-dev' }}.azurewebsites.net"
        echo "Waiting for deployment to stabilize..."
        for i in 1 2 3 4 5; do
          sleep 15
          echo "Health check attempt $i..."
          if curl -sf "$APP_URL/api/health" -o /dev/null; then
            echo "Health check passed on attempt $i"
            exit 0
          fi
        done
        echo "Health check did not pass after 5 attempts (deployment may still be starting)"
        exit 1

    - name: Verify CORS and SignalR
      run: |
        APP_URL="https://${{ vars.AZURE_APP_SERVICE_NAME_DEV || 'app-vendor-mdm-api-dev' }}.azurewebsites.net"
        SWA_ORIGIN="https://thankful-field-0258f8110.3.azurestaticapps.net"
        echo "=== CORS Preflight Check ==="
        CORS_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
          -X OPTIONS "$APP_URL/api/health" \
          -H "Origin: $SWA_ORIGIN" \
          -H "Access-Control-Request-Method: GET" \
          -H "Access-Control-Request-Headers: Content-Type")
        echo "CORS preflight status: $CORS_RESPONSE"
        if [ "$CORS_RESPONSE" -ne 204 ] && [ "$CORS_RESPONSE" -ne 200 ]; then
          echo "WARNING: CORS preflight returned $CORS_RESPONSE (expected 200/204)"
        fi
        echo "=== CORS Headers Check ==="
        curl -s -I "$APP_URL/api/health" \
          -H "Origin: $SWA_ORIGIN" | grep -i "access-control" || echo "WARNING: No CORS headers in response"
        echo "=== SignalR Negotiate Check ==="
        SIGNALR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST "$APP_URL/hubs/events/negotiate?negotiateVersion=1&mockUser=Requestor" \
          -H "Origin: $SWA_ORIGIN" \
          -H "Content-Type: application/json")
        echo "SignalR negotiate status: $SIGNALR_STATUS"
        if [ "$SIGNALR_STATUS" -eq 405 ]; then
          echo "ERROR: SignalR negotiate returned 405 - check ASPNETCORE_ENVIRONMENT and MockAuth"
          exit 1
        fi
        echo "Post-deployment verification complete"

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app-vendor-mdm-api-prod.azurewebsites.net

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-api
        path: ./publish

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Ensure App Service is running (Prod)
      continue-on-error: true
      run: |
        APP_NAME="${{ vars.AZURE_APP_SERVICE_NAME_PROD || 'app-vendor-mdm-api-prod' }}"
        echo "Discovering resource group for $APP_NAME..."
        RG=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup" -o tsv 2>/dev/null | head -1)
        if [ -z "$RG" ]; then
          echo "WARNING: Could not find resource group for $APP_NAME - skipping state check"
          exit 0
        fi
        echo "Found resource group: $RG"
        STATE=$(az webapp show --name "$APP_NAME" --resource-group "$RG" --query "state" -o tsv 2>/dev/null || echo "Unknown")
        echo "App Service state: $STATE"
        if [ "$STATE" != "Running" ]; then
          echo "Starting App Service..."
          az webapp start --name "$APP_NAME" --resource-group "$RG"
          echo "Waiting for App Service to start..."
          sleep 15
        fi

    - name: Deploy to Azure App Service (Prod)
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_APP_SERVICE_NAME_PROD || 'app-vendor-mdm-api-prod' }}
        package: ./publish

    - name: Health check
      run: |
        APP_URL="https://${{ vars.AZURE_APP_SERVICE_NAME_PROD || 'app-vendor-mdm-api-prod' }}.azurewebsites.net"
        echo "Waiting for deployment to stabilize..."
        for i in 1 2 3 4 5; do
          sleep 15
          echo "Health check attempt $i..."
          if curl -sf "$APP_URL/api/health" -o /dev/null; then
            echo "Health check passed on attempt $i"
            exit 0
          fi
        done
        echo "Health check did not pass after 5 attempts (deployment may still be starting)"
        exit 1
