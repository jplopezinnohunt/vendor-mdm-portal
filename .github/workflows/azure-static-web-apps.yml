name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/azure-static-web-apps.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/azure-static-web-apps.yml'

env:
  SWA_BASE_URL: ${{ vars.SWA_BASE_URL || 'https://thankful-field-0258f8110.3.azurestaticapps.net' }}

jobs:
  build_and_deploy_job:
    # Azure Static Web Apps deploy via GitHub Actions (by design)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow Git safe directory
        run: git config --global --add safe.directory /github/workspace
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          api_location: ""
          output_location: "dist"

      - name: Verify deployment
        run: |
          SITE_URL="${{ env.SWA_BASE_URL }}"
          echo "Verifying deployment at $SITE_URL ..."
          for i in 1 2 3 4 5; do
            sleep 10
            echo "Verification attempt $i..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Deployment verified: HTTP $HTTP_STATUS"
              exit 0
            fi
            echo "Got HTTP $HTTP_STATUS, retrying..."
          done
          echo "Deployment verification failed after 5 attempts"
          exit 1

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          app_location: "/frontend"
