name: Deploy Database Migrations

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/VendorMdm.Api/Migrations/**'
      - 'backend/VendorMdm.Api/Data/**'
      - '.github/workflows/deploy-database-migrations.yml'
  workflow_dispatch:
    inputs:
      migration_name:
        description: 'Migration to apply (e.g., InitialCanonical) or leave empty for latest'
        required: false
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
      skip_destructive_check:
        description: 'Skip destructive change check (DANGER: Only use after manual verification)'
        required: false
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore .NET Tools
      run: dotnet tool restore
    
    - name: Generate Migration Script
      env:
        DataSourceMode: Connected  # Force SQL Server provider instead of SQLite
        # Provide a dummy connection string for script generation (no actual DB connection needed)
        # This satisfies SQL Server provider validation without requiring authentication
        ConnectionStrings__Sql: "Server=localhost;Database=VendorMdmDb;Trusted_Connection=True;TrustServerCertificate=True;"
      run: |
        cd backend/VendorMdm.Api
        dotnet ef migrations script \
          --project . \
          --context SqlDbContext \
          --idempotent \
          --output ../../migration-script.sql
    
    - name: Patch for SQL Server (replace TEXT with nvarchar)
      run: |
        sed -i 's/"TEXT"/"nvarchar(max)"/g' migration-script.sql
        echo "Migration script patched for SQL Server compatibility"
    
    - name: Show Migration Preview
      run: |
        echo "=== MIGRATION SCRIPT PREVIEW ==="
        head -n 50 migration-script.sql
        echo "=== (showing first 50 lines) ==="

    - name: Check for Destructive Changes (Zero Data Loss)
      run: |
        echo "🔍 Analyzing migration script for destructive commands..."

        # Check if bypass is enabled (manual workflow only, after verification)
        if [ "${{ inputs.skip_destructive_check }}" == "true" ]; then
          echo "⚠️ DESTRUCTIVE CHECK BYPASSED BY MANUAL OVERRIDE"
          echo "Ensure you have manually verified the migration preserves data!"
          exit 0
        fi

        # Check for DROP TABLE (always block - never safe)
        if grep -i "DROP TABLE" migration-script.sql; then
          echo "❌ DROP TABLE detected - this is never auto-approved"
          echo "Deployment Cancelled."
          exit 1
        fi

        # Check for DROP COLUMN
        if grep -i "DROP COLUMN" migration-script.sql; then
          echo "⚠️ DROP COLUMN detected. Checking for data migration pattern..."

          # Smart check: If UPDATE sets new column AND DROP removes old column, data is preserved
          # Check for Role→Roles migration pattern
          HAS_UPDATE=$(grep -ci "UPDATE.*Users" migration-script.sql || echo "0")
          HAS_SET_ROLES=$(grep -ci "SET.*Roles" migration-script.sql || echo "0")

          if [ "$HAS_UPDATE" -gt "0" ] && [ "$HAS_SET_ROLES" -gt "0" ]; then
            echo "✅ Data migration pattern detected:"
            echo "   - Found UPDATE on Users table"
            echo "   - Found SET Roles assignment"
            echo "   - DROP COLUMN Role is safe (data preserved in Roles)"
            echo "Proceeding with migration..."
            exit 0
          fi

          echo "❌ DESTRUCTIVE CHANGE DETECTED!"
          echo "The migration script contains DROP COLUMN without data migration."
          echo "This violates the Zero Data Loss Policy."
          echo ""
          echo "If the migration PRESERVES data (e.g., migrates to new column before drop):"
          echo "1. Manually verify the migration file"
          echo "2. Re-run workflow with 'skip_destructive_check: true'"
          echo ""
          echo "Deployment Cancelled."
          exit 1
        fi

        echo "✅ No destructive changes detected. Safe to proceed."
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Parse Azure Credentials
      id: creds
      run: |
        echo "clientId=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_OUTPUT
        echo "clientSecret=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_OUTPUT
        echo "tenantId=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_OUTPUT

    - name: Add Firewall Rule for GitHub Runner
      id: firewall
      run: |
        # Determine SQL Server name
        TARGET_ENV="${{ inputs.environment }}"
        if [ -z "$TARGET_ENV" ]; then TARGET_ENV="dev"; fi
        if [ "$TARGET_ENV" == "dev" ]; then SQL_SERVER="sql-vendor-mdm-dev"; else SQL_SERVER="sql-vendor-mdm-prod"; fi
        
        # Get Runner IP
        AGENT_IP=$(curl -s https://api.ipify.org)
        echo "Adding firewall rule for IP: $AGENT_IP"
        
        # Add Rule
        az sql server firewall-rule create \
          --resource-group rg-vendor-mdm-dev \
          --server $SQL_SERVER \
          --name "GitHubRunner-${{ github.run_id }}" \
          --start-ip-address $AGENT_IP \
          --end-ip-address $AGENT_IP
        
        echo "agent_ip=$AGENT_IP" >> $GITHUB_OUTPUT
        echo "sql_server=$SQL_SERVER" >> $GITHUB_OUTPUT

    - name: Install sqlcmd
      run: |
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
        echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> ~/.bashrc

    - name: Apply Migrations (SQL Script)
      run: |
        export PATH="$PATH:/opt/mssql-tools18/bin"

        # Set environment variables based on input (Default to 'dev' if empty/push trigger)
        TARGET_ENV="${{ inputs.environment }}"
        if [ -z "$TARGET_ENV" ]; then
          TARGET_ENV="dev"
        fi

        if [ "$TARGET_ENV" == "dev" ]; then
          SQL_SERVER="sql-vendor-mdm-dev"
          DATABASE="VendorMdmDb"
        elif [ "$TARGET_ENV" == "prod" ]; then
          SQL_SERVER="sql-vendor-mdm-prod"
          DATABASE="VendorMdmDb"
        else
          echo "❌ Error: Invalid or missing target environment: '$TARGET_ENV'"
          echo "Allowed values: 'dev', 'prod'"
          exit 1
        fi

        echo "Applying PATCHED migration script to $SQL_SERVER (Database: $DATABASE)..."
        echo "Using patched script with SQL Server types (nvarchar instead of TEXT)"

        # Get access token for Azure SQL using service principal
        ACCESS_TOKEN=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)

        # Use sqlcmd with AAD access token
        /opt/mssql-tools18/bin/sqlcmd \
          -S "${SQL_SERVER}.database.windows.net" \
          -d "$DATABASE" \
          -P "$ACCESS_TOKEN" \
          -G \
          -i migration-script.sql \
          -b \
          -C

        echo "✅ Migration script applied successfully"

    - name: Remove Firewall Rule
      if: always()
      run: |
        # Retrieve values from previous step
        AGENT_IP="${{ steps.firewall.outputs.agent_ip }}"
        SQL_SERVER="${{ steps.firewall.outputs.sql_server }}"
        
        if [ ! -z "$AGENT_IP" ]; then
          echo "Removing firewall rule for IP: $AGENT_IP"
          az sql server firewall-rule delete \
            --resource-group rg-vendor-mdm-dev \
            --server $SQL_SERVER \
            --name "GitHubRunner-${{ github.run_id }}"
        fi
    
    - name: Verify Migration
      run: |
        echo "Migration applied successfully to ${{ inputs.environment }}"
        echo "Verify tables in Azure Portal SQL Query Editor"
