name: Deploy Backend Artifacts

on:
  workflow_dispatch:
    inputs:
      function_app_name:
        description: 'Function App name to deploy to'
        required: true
        type: string
        default: 'mdmportal-func-dev'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend/VendorMdm.Artifacts'
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: |
        cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        dotnet restore

    - name: Build
      run: |
        cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        dotnet build --configuration Release --no-restore

    - name: Publish
      run: |
        cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        dotnet publish --configuration Release --no-build --output ./output

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Functions
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ inputs.function_app_name }}
        package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
